name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run sample (compact)
        run: npm run test:sample
      - name: Run sample (full)
        run: npm run test:full
      - name: Run sample (critical)
        run: npm run test:critical
      - name: Run sample (sonnet bucket)
        run: npm run test:sonnet
      - name: Run sample (fable bucket, full)
        run: npm run test:fable
      - name: Run sample (fable bucket, compact)
        run: npm run test:fable:compact
      - name: Run sample (--hide window filter)
        run: npm run test:hide
      - name: Run ultra (weekly only, compact)
        run: npm run test:ultra
      - name: Run ultra (weekly only, full kawaii)
        run: npm run test:ultra:full
      - name: Run ultra (week + fable, compact)
        run: npm run test:ultra:fable
      - name: Run sample (warming up)
        run: npm run test:warming
      - name: Run sample (weekly saturated)
        run: npm run test:saturated
      - name: Run sample (api cost-only)
        run: npm run test:apicost
      - name: Run sample (pro plan filter)
        run: npm run test:pro
      - name: Run sample (--no-cost chip toggle, full)
        run: npm run test:no-cost
      - name: Run sample (--no-cost chip toggle, compact)
        run: npm run test:no-cost:compact
      - name: Run sample (--no-cost chip toggle, wide)
        run: npm run test:no-cost:wide
      - name: Run sample (--no-ctx chip toggle, full)
        run: npm run test:no-ctx
      - name: Run sample (--no-ctx chip toggle, compact)
        run: npm run test:no-ctx:compact
      - name: Run sample (--no-ctx chip toggle, wide)
        run: npm run test:no-ctx:wide
      - name: Run sample (--no-model chip toggle, compact)
        run: npm run test:no-model
      - name: Run sample (stale cache bars)
        run: npm run test:stale
      - name: Update command (offline)
        run: npm run test:update
      - name: Cache tmp sweep
        run: npm run test:cache-tmp
      - name: Fable usage overlay (offline fixture)
        run: npm run test:fable-usage
      - name: Unused / reset windows read 0%
        run: npm run test:zero
